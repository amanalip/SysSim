name: Feature request
description: Propose a bounded educational or simulation improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Learning or workflow problem
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed behavior and evidence
      description: Include model assumptions, limitations, acceptance tests, and primary sources.
    validations:
      required: true
